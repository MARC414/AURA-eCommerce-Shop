<!doctype html><html><head><meta charset="utf-8"><style>
:root{--ground:#2F332B;--paper:#F4F2EE;--mist:#D0D3C4;--button:#9AA66C;--accent:#55632A;--gold:#C5AD70;}
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden} body{font-family:Manrope,Arial,sans-serif;background:var(--ground);color:var(--paper)}
.serif{font-family:"Cormorant Garamond",Georgia,serif}.eyebrow{font-size:14px;letter-spacing:.22em;text-transform:uppercase}.small{font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.logo{position:absolute;z-index:4;width:380px;height:auto}.mark{position:absolute;z-index:2}.hairline{height:1px;background:currentColor;opacity:.55}.cta{display:inline-block;border:1px solid var(--button);color:var(--paper);padding:18px 24px;font-size:13px;letter-spacing:.16em;text-transform:uppercase}

body{width:1600px;height:600px;background:var(--ground);position:relative}.bg{position:absolute;inset:0;background:url('../opar-section-bg-wide-ground-2400x1400.png') center/cover no-repeat;opacity:.5}.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(47,51,43,.96),rgba(47,51,43,.38))}.logo{left:84px;top:78px;width:270px}.copy{position:absolute;left:84px;top:210px}.copy h1{font-size:66px;line-height:.88;font-weight:400;margin:14px 0}.copy p{font-size:20px;color:var(--mist);margin:0}.right{position:absolute;right:100px;top:220px;text-align:right;color:var(--mist)}.right .mark{position:static;width:180px;opacity:.7;margin-bottom:20px}</style></head><body><div class="bg"></div><div class="shade"></div><img class="logo" src="../opar-lockup-transparent-main-600.png"><main class="copy"><div class="eyebrow">A world of conscious living</div><h1 class="serif">A quieter kind<br><i>of beautiful.</i></h1><p>Objects and knowledge for a slower, more sensory life.</p></main><div class="right"><img class="mark" src="../opar-mark-transparent-main-600.png"><div class="small">Discover the collection →</div></div></body></html>
