<!doctype html><html><head><meta charset="utf-8"><style>
:root{--ground:#2F332B;--paper:#F4F2EE;--mist:#D0D3C4;--button:#9AA66C;--accent:#55632A;--gold:#C5AD70;}
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden} body{font-family:Manrope,Arial,sans-serif;background:var(--ground);color:var(--paper)}
.serif{font-family:"Cormorant Garamond",Georgia,serif}.eyebrow{font-size:14px;letter-spacing:.22em;text-transform:uppercase}.small{font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.logo{position:absolute;z-index:4;width:380px;height:auto}.mark{position:absolute;z-index:2}.hairline{height:1px;background:currentColor;opacity:.55}.cta{display:inline-block;border:1px solid var(--button);color:var(--paper);padding:18px 24px;font-size:13px;letter-spacing:.16em;text-transform:uppercase}

body{width:1080px;height:1080px;background:var(--ground);position:relative}.bg{position:absolute;inset:0;background:url('../opar-section-bg-ground-1600.png') center/cover no-repeat;opacity:.56}.panel{position:absolute;inset:56px;border:1px solid rgba(208,211,196,.52)}.logo{left:104px;top:108px;width:300px}.copy{position:absolute;left:104px;right:110px;bottom:220px}.copy h1{font-size:88px;line-height:.9;font-weight:400;margin:18px 0 24px}.copy p{width:660px;font-size:24px;line-height:1.45;color:var(--mist);margin:0}.footer{position:absolute;left:104px;bottom:105px;right:104px;display:flex;justify-content:space-between;align-items:center;color:var(--mist)}.footer .mark{position:static;width:60px;height:60px}.footer .small{font-size:12px}</style></head><body><div class="bg"></div><div class="panel"></div><img class="logo" src="../opar-lockup-transparent-main-600.png"><main class="copy"><div class="eyebrow">Conscious living</div><h1 class="serif">Make room<br><i>for wonder.</i></h1><p>Objects and knowledge for a slower, more sensory life.</p></main><div class="footer"><span class="small">@opar · a world of conscious living</span><img class="mark" src="../opar-mark-transparent-main-600.png"></div></body></html>
