<!doctype html><html><head><meta charset="utf-8"><style>
:root{--ground:#2F332B;--paper:#F4F2EE;--mist:#D0D3C4;--button:#9AA66C;--accent:#55632A;--gold:#C5AD70;}
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden} body{font-family:Manrope,Arial,sans-serif;background:var(--ground);color:var(--paper)}
.serif{font-family:"Cormorant Garamond",Georgia,serif}.eyebrow{font-size:14px;letter-spacing:.22em;text-transform:uppercase}.small{font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.logo{position:absolute;z-index:4;width:380px;height:auto}.mark{position:absolute;z-index:2}.hairline{height:1px;background:currentColor;opacity:.55}.cta{display:inline-block;border:1px solid var(--button);color:var(--paper);padding:18px 24px;font-size:13px;letter-spacing:.16em;text-transform:uppercase}

body{width:1080px;height:1920px;background:var(--ground);position:relative}.bg{position:absolute;inset:0;background:url('../opar-section-bg-ground-1600.png') center/cover no-repeat;opacity:.42}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(47,51,43,.94),rgba(47,51,43,.12) 42%,rgba(47,51,43,.96))}.top{position:absolute;left:82px;right:82px;top:92px;display:flex;justify-content:space-between;align-items:center}.logo{position:static;width:290px}.top span{color:var(--mist)}.copy{position:absolute;left:82px;right:82px;bottom:320px}.copy h1{font-size:120px;line-height:.82;font-weight:400;margin:20px 0 26px}.copy p{color:var(--mist);font-size:26px;line-height:1.48;width:700px}.cta{margin-top:34px}.footer{position:absolute;left:82px;right:82px;bottom:110px;display:flex;justify-content:space-between;align-items:center;color:var(--mist)}.footer img{width:82px;height:82px}</style></head><body><div class="bg"></div><div class="shade"></div><div class="top"><img class="logo" src="../opar-lockup-transparent-main-600.png"><span class="small">Swipe / discover</span></div><main class="copy"><div class="eyebrow">Objects · knowledge · ritual</div><h1 class="serif">Live with<br><i>intention.</i></h1><p>A world of conscious living, curated for a slower, more sensory life.</p><span class="cta">Explore OPAR</span></main><div class="footer"><span class="small">@opar</span><img src="../opar-mark-transparent-main-600.png"></div></body></html>
