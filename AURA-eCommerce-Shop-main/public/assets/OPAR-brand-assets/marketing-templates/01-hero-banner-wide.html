<!doctype html><html><head><meta charset="utf-8"><style>
:root{--ground:#2F332B;--paper:#F4F2EE;--mist:#D0D3C4;--button:#9AA66C;--accent:#55632A;--gold:#C5AD70;}
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden} body{font-family:Manrope,Arial,sans-serif;background:var(--ground);color:var(--paper)}
.serif{font-family:"Cormorant Garamond",Georgia,serif}.eyebrow{font-size:14px;letter-spacing:.22em;text-transform:uppercase}.small{font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.logo{position:absolute;z-index:4;width:380px;height:auto}.mark{position:absolute;z-index:2}.hairline{height:1px;background:currentColor;opacity:.55}.cta{display:inline-block;border:1px solid var(--button);color:var(--paper);padding:18px 24px;font-size:13px;letter-spacing:.16em;text-transform:uppercase}

body{width:2400px;height:1000px;background:var(--ground);position:relative}.bg{position:absolute;inset:0;background:url('../opar-section-bg-wide-ground-2400x1400.png') center/cover no-repeat;opacity:.9}.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(47,51,43,.98) 0%,rgba(47,51,43,.85) 46%,rgba(47,51,43,.12) 100%)}.logo{left:120px;top:100px;width:480px}.copy{position:absolute;left:120px;top:330px;width:850px}.copy h1{font-size:112px;line-height:.88;font-weight:400;margin:24px 0}.copy p{font-size:28px;line-height:1.45;color:var(--mist);width:650px;margin:0 0 38px}.meta{position:absolute;left:120px;bottom:100px;display:flex;align-items:center;gap:22px;color:var(--mist)}.orbit-note{position:absolute;right:130px;bottom:120px;color:var(--mist);opacity:.78}.orbit-note .line{width:180px;margin-bottom:16px}</style></head><body><div class="bg"></div><div class="shade"></div><img class="logo" src="../opar-lockup-transparent-main-1200.png"><main class="copy"><div class="eyebrow">A world of conscious living</div><h1 class="serif">Slower.<br><i>More sensory.</i></h1><p>Objects and knowledge for a slower, more sensory life.</p><span class="cta">Discover OPAR</span></main><div class="meta"><span class="hairline" style="width:130px"></span><span class="small">Editorial banner template</span></div><div class="orbit-note"><div class="hairline line"></div><div class="small">Objects · Knowledge · Ritual</div></div></body></html>
