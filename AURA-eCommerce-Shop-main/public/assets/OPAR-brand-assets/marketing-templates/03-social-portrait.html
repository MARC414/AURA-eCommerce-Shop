<!doctype html><html><head><meta charset="utf-8"><style>

body{width:1080px;height:1350px;background:var(--paper);position:relative;color:var(--ground)}.bg{position:absolute;inset:0;background:url('../opar-section-bg-wide-paper-2400x1400.png') center/cover no-repeat;opacity:.7}.top{position:absolute;left:90px;right:90px;top:88px;display:flex;justify-content:space-between;align-items:center}.logo{position:static;width:280px;filter:none}.top .small{color:var(--accent)}.panel{position:absolute;left:90px;right:90px;top:260px;bottom:90px;border:1px solid rgba(85,99,42,.45);padding:72px 62px}.copy{position:absolute;left:152px;right:152px;top:390px}.copy h1{font-size:104px;line-height:.84;font-weight:400;margin:20px 0 30px}.copy p{font-size:25px;line-height:1.5;color:#43463F;width:630px}.rule{width:280px;height:1px;background:var(--accent);margin:42px 0}.quote{font-family:Georgia,serif;font-size:32px;line-height:1.25;font-style:italic;color:var(--accent);width:600px}.bottom{position:absolute;bottom:142px;left:152px;right:152px;display:flex;justify-content:space-between;align-items:end;color:var(--accent)}.bottom img{width:90px;height:90px}</style></head><body><div class="bg"></div><div class="top"><img class="logo" src="../opar-lockup-ground.png"><span class="small">Journal / 01</span></div><div class="panel"></div><main class="copy"><div class="eyebrow">A note from OPAR</div><h1 class="serif">The art of<br><i>the everyday.</i></h1><div class="rule"></div><p>Small rituals can make a life feel more considered, more tactile, and more entirely your own.</p><div class="quote">“A slower pace leaves room for the senses.”</div></main><div class="bottom"><span class="small">Read more at op ar</span><img src="../opar-mark-transparent-ground-600.png"></div></body></html>
