<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" aria-label="OPAR Seed and Orbit Emblem" role="img">
  <title>OPAR — Seed + Orbit Emblem</title>
  <!-- Outer Orbit (inclined ellipse) -->
  <ellipse cx="50" cy="50" rx="42" ry="22" fill="none" stroke="#C5AD70" stroke-width="1.75" transform="rotate(-28 50 50)" stroke-dasharray="0" opacity="0.95" />
  <!-- Secondary Orbit Accents (delicate astronomical ring line) -->
  <ellipse cx="50" cy="50" rx="38" ry="19" fill="none" stroke="#82915B" stroke-width="0.75" transform="rotate(-28 50 50)" stroke-dasharray="2 4" opacity="0.6" />
  <!-- Orbiting celestial node -->
  <circle cx="82" cy="33" r="2.5" fill="#C5AD70" />
  <!-- Central Seed (Organic Almond / Teardrop form) -->
  <g transform="translate(50, 50) rotate(-15) translate(-50, -50)">
    <!-- Seed Body -->
    <path d="M 50 26 C 59 38 62 55 50 74 C 38 55 41 38 50 26 Z" fill="#101B12" stroke="#C5AD70" stroke-width="1.5" />
    <!-- Seed Inner Life Line -->
    <path d="M 50 34 C 52 44 52 56 50 66" fill="none" stroke="#C5AD70" stroke-width="1.2" stroke-linecap="round" />
    <!-- Seed Core Spark / Germination Point -->
    <circle cx="50" cy="50" r="1.75" fill="#C5AD70" />
  </g>
</svg>
