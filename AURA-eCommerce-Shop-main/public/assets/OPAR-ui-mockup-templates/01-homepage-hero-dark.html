<!doctype html><html><head><meta charset="utf-8"><style>
:root{--ground:#2F332B;--paper:#F4F2EE;--mist:#D0D3C4;--button:#9AA66C;--accent:#55632A;--line:#4F524A;--paperline:#CDCCC7;--body:#43463F}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Manrope,Arial,sans-serif;color:var(--paper);background:var(--ground)}
.serif{font-family:"Cormorant Garamond",Georgia,serif}.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase}.micro{font-size:10px;letter-spacing:.15em;text-transform:uppercase}.small{font-size:12px;letter-spacing:.12em;text-transform:uppercase}.muted{color:var(--mist)}
.nav{height:88px;display:flex;align-items:center;justify-content:space-between;padding:0 56px;border-bottom:1px solid rgba(208,211,196,.26);position:relative;z-index:4}.nav img{width:220px}.navlinks{display:flex;gap:28px;color:var(--mist);font-size:12px;letter-spacing:.15em;text-transform:uppercase}.icons{display:flex;gap:16px;color:var(--mist)}
.btn{display:inline-block;padding:15px 20px;border:1px solid var(--button);color:var(--paper);font-size:11px;letter-spacing:.15em;text-transform:uppercase}.btn.dark{background:var(--ground);color:var(--paper);border-color:var(--ground)}
.card{background:var(--paper);color:var(--ground);border:1px solid var(--paperline)}.card img{display:block;width:100%;height:100%;object-fit:cover}.card .meta{padding:18px 18px 20px}.card h3{font-family:Georgia,serif;font-size:27px;font-weight:400;margin:7px 0}.price{font-size:13px;color:var(--body)}

body{width:1440px;height:900px}.hero{height:812px;position:relative;background:var(--ground);overflow:hidden}.hero-bg{position:absolute;inset:0;background:url('assets/section-bg-ground.png') center/cover;opacity:.78}.scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(47,51,43,.98) 0%,rgba(47,51,43,.82) 45%,rgba(47,51,43,.16) 100%)}.hero-copy{position:absolute;left:88px;top:170px;width:620px}.hero-copy h1{font-size:84px;line-height:.9;font-weight:400;margin:20px 0 24px}.hero-copy p{font-size:18px;line-height:1.55;color:var(--mist);max-width:520px;margin-bottom:30px}.hero-mark{position:absolute;right:-80px;top:40px;width:720px;opacity:.14}</style></head><body><nav class="nav"><img src="assets/opar-lockup-main.png"><div class="navlinks"><span>Shop</span><span>Discover</span><span>Journal</span><span>About</span></div><div class="icons">♡　Bag (0)</div></nav><section class="hero"><div class="hero-bg"></div><div class="scrim"></div><img class="hero-mark" src="assets/opar-mark-main.png"><div class="hero-copy"><div class="eyebrow muted">A world of conscious living</div><h1 class="serif">Objects for a<br><i>slower life.</i></h1><p>Thoughtful pieces and knowledge for a more sensory everyday.</p><span class="btn">Explore the collection</span></div></section></body></html>
