<!doctype html><html><head><meta charset="utf-8"><style>
:root{--ground:#2F332B;--paper:#F4F2EE;--mist:#D0D3C4;--button:#9AA66C;--accent:#55632A;--line:#4F524A;--paperline:#CDCCC7;--body:#43463F}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Manrope,Arial,sans-serif;color:var(--paper);background:var(--ground)}
.serif{font-family:"Cormorant Garamond",Georgia,serif}.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase}.micro{font-size:10px;letter-spacing:.15em;text-transform:uppercase}.small{font-size:12px;letter-spacing:.12em;text-transform:uppercase}.muted{color:var(--mist)}
.nav{height:88px;display:flex;align-items:center;justify-content:space-between;padding:0 56px;border-bottom:1px solid rgba(208,211,196,.26);position:relative;z-index:4}.nav img{width:220px}.navlinks{display:flex;gap:28px;color:var(--mist);font-size:12px;letter-spacing:.15em;text-transform:uppercase}.icons{display:flex;gap:16px;color:var(--mist)}
.btn{display:inline-block;padding:15px 20px;border:1px solid var(--button);color:var(--paper);font-size:11px;letter-spacing:.15em;text-transform:uppercase}.btn.dark{background:var(--ground);color:var(--paper);border-color:var(--ground)}
.card{background:var(--paper);color:var(--ground);border:1px solid var(--paperline)}.card img{display:block;width:100%;height:100%;object-fit:cover}.card .meta{padding:18px 18px 20px}.card h3{font-family:Georgia,serif;font-size:27px;font-weight:400;margin:7px 0}.price{font-size:13px;color:var(--body)}

body{width:1440px;height:900px;background:var(--paper);color:var(--ground)}.nav{border-color:var(--paperline)}.nav img{width:220px}.navlinks,.icons{color:var(--body)}.hero{height:812px;position:relative;overflow:hidden;background:var(--paper)}.hero-bg{position:absolute;inset:0;background:url('assets/section-bg-paper.png') center/cover;opacity:.78}.hero-copy{position:absolute;left:88px;top:170px;width:590px}.hero-copy h1{font-size:84px;line-height:.9;font-weight:400;margin:20px 0 24px}.hero-copy p{font-size:18px;line-height:1.55;color:var(--body);max-width:520px;margin-bottom:30px}.hero-mark{position:absolute;right:-90px;top:60px;width:720px;opacity:.10}.btn{color:var(--ground);border-color:var(--accent)}.side-note{position:absolute;right:88px;bottom:84px;color:var(--accent);writing-mode:vertical-rl;transform:rotate(180deg)}</style></head><body><nav class="nav"><img src="assets/opar-lockup-ground.png"><div class="navlinks"><span>Shop</span><span>Discover</span><span>Journal</span><span>About</span></div><div class="icons">♡　Bag (0)</div></nav><section class="hero"><div class="hero-bg"></div><img class="hero-mark" src="assets/opar-mark-main.png"><div class="hero-copy"><div class="eyebrow" style="color:var(--accent)">The considered edit</div><h1 class="serif">The art of<br><i>the everyday.</i></h1><p>Objects and knowledge for a slower, more sensory life.</p><span class="btn">View the edit</span></div><div class="side-note small">Conscious living · OPAR</div></section></body></html>
