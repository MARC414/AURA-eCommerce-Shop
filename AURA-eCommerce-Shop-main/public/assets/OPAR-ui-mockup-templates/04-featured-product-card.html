<!doctype html><html><head><meta charset="utf-8"><style>
:root{--ground:#2F332B;--paper:#F4F2EE;--mist:#D0D3C4;--button:#9AA66C;--accent:#55632A;--line:#4F524A;--paperline:#CDCCC7;--body:#43463F}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Manrope,Arial,sans-serif;color:var(--paper);background:var(--ground)}
.serif{font-family:"Cormorant Garamond",Georgia,serif}.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase}.micro{font-size:10px;letter-spacing:.15em;text-transform:uppercase}.small{font-size:12px;letter-spacing:.12em;text-transform:uppercase}.muted{color:var(--mist)}
.nav{height:88px;display:flex;align-items:center;justify-content:space-between;padding:0 56px;border-bottom:1px solid rgba(208,211,196,.26);position:relative;z-index:4}.nav img{width:220px}.navlinks{display:flex;gap:28px;color:var(--mist);font-size:12px;letter-spacing:.15em;text-transform:uppercase}.icons{display:flex;gap:16px;color:var(--mist)}
.btn{display:inline-block;padding:15px 20px;border:1px solid var(--button);color:var(--paper);font-size:11px;letter-spacing:.15em;text-transform:uppercase}.btn.dark{background:var(--ground);color:var(--paper);border-color:var(--ground)}
.card{background:var(--paper);color:var(--ground);border:1px solid var(--paperline)}.card img{display:block;width:100%;height:100%;object-fit:cover}.card .meta{padding:18px 18px 20px}.card h3{font-family:Georgia,serif;font-size:27px;font-weight:400;margin:7px 0}.price{font-size:13px;color:var(--body)}

body{width:1440px;height:900px;background:var(--ground)}.feature{height:812px;display:grid;grid-template-columns:1.08fr .92fr;position:relative}.visual{position:relative;background:var(--paper);overflow:hidden}.visual img{width:100%;height:100%;object-fit:cover}.visual:after{content:"";position:absolute;inset:0;background:url('assets/section-bg-paper.png') center/cover;opacity:.18;mix-blend-mode:multiply}.product-mark{position:absolute;z-index:2;left:45px;bottom:45px;width:130px;opacity:.85}.details{padding:100px 88px;background:var(--ground)}.details h1{font-size:72px;line-height:.9;font-weight:400;margin:20px 0}.details p{color:var(--mist);font-size:18px;line-height:1.55;max-width:420px}.rule{height:1px;background:var(--line);margin:36px 0}.detail-row{display:flex;justify-content:space-between;color:var(--mist);max-width:420px;padding:15px 0;border-bottom:1px solid var(--line)}.buy{margin-top:34px;background:var(--button);color:var(--ground);border-color:var(--button);width:220px;text-align:center}</style></head><body><nav class="nav"><img src="assets/opar-lockup-main.png"><div class="navlinks"><span>Shop</span><span>Discover</span><span>Journal</span><span>About</span></div><div class="icons">♡　Bag (0)</div></nav><section class="feature"><div class="visual"><img src="assets/product-botanical.jpg"><img class="product-mark" src="assets/opar-mark-ground.png"></div><div class="details"><div class="eyebrow muted">Herbal botanicals · House piece</div><h1 class="serif">A quiet<br><i>ritual.</i></h1><p>A considered object for everyday attention, selected for material presence and a slower pace.</p><div class="rule"></div><div class="detail-row"><span>Availability</span><span>In the collection</span></div><div class="detail-row"><span>Price</span><span>£32.00</span></div><span class="btn buy">View the piece</span></div></section></body></html>
