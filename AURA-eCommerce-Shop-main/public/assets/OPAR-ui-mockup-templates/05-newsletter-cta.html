<!doctype html><html><head><meta charset="utf-8"><style>
:root{--ground:#2F332B;--paper:#F4F2EE;--mist:#D0D3C4;--button:#9AA66C;--accent:#55632A;--line:#4F524A;--paperline:#CDCCC7;--body:#43463F}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Manrope,Arial,sans-serif;color:var(--paper);background:var(--ground)}
.serif{font-family:"Cormorant Garamond",Georgia,serif}.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase}.micro{font-size:10px;letter-spacing:.15em;text-transform:uppercase}.small{font-size:12px;letter-spacing:.12em;text-transform:uppercase}.muted{color:var(--mist)}
.nav{height:88px;display:flex;align-items:center;justify-content:space-between;padding:0 56px;border-bottom:1px solid rgba(208,211,196,.26);position:relative;z-index:4}.nav img{width:220px}.navlinks{display:flex;gap:28px;color:var(--mist);font-size:12px;letter-spacing:.15em;text-transform:uppercase}.icons{display:flex;gap:16px;color:var(--mist)}
.btn{display:inline-block;padding:15px 20px;border:1px solid var(--button);color:var(--paper);font-size:11px;letter-spacing:.15em;text-transform:uppercase}.btn.dark{background:var(--ground);color:var(--paper);border-color:var(--ground)}
.card{background:var(--paper);color:var(--ground);border:1px solid var(--paperline)}.card img{display:block;width:100%;height:100%;object-fit:cover}.card .meta{padding:18px 18px 20px}.card h3{font-family:Georgia,serif;font-size:27px;font-weight:400;margin:7px 0}.price{font-size:13px;color:var(--body)}

body{width:1440px;height:900px;background:var(--ground)}.wrap{height:812px;position:relative;overflow:hidden;background:url('assets/section-bg-button.png') center/cover;}.shade{position:absolute;inset:0;background:rgba(47,51,43,.76)}.mark{position:absolute;width:800px;right:-140px;top:-80px;opacity:.16}.content{position:absolute;left:110px;top:180px;width:620px}.content h1{font-size:76px;line-height:.88;font-weight:400;margin:20px 0}.content p{font-size:18px;line-height:1.55;color:var(--mist);max-width:530px}.form{display:flex;gap:8px;margin-top:36px}.input{width:330px;padding:17px;border:1px solid var(--mist);background:transparent;color:var(--paper);font-size:14px}.foot{position:absolute;left:110px;bottom:85px;right:110px;display:flex;justify-content:space-between;color:var(--mist)}.foot .small{font-size:11px}</style></head><body><nav class="nav"><img src="assets/opar-lockup-main.png"><div class="navlinks"><span>Shop</span><span>Discover</span><span>Journal</span><span>About</span></div><div class="icons">♡　Bag (0)</div></nav><section class="wrap"><div class="shade"></div><img class="mark" src="assets/opar-mark-main.png"><div class="content"><div class="eyebrow muted">The OPAR letter</div><h1 class="serif">Make space<br><i>for more.</i></h1><p>Notes on conscious living, new collections, and the rituals that make the everyday feel considered.</p><div class="form"><div class="input">Your email address</div><span class="btn">Subscribe</span></div></div><div class="foot"><span class="small">A world of conscious living</span><span class="small">Objects · Knowledge · Ritual</span></div></section></body></html>
